name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.x'
          channel: stable

      - name: Create local.properties
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Create config.dart
        run: |
          cat > lib/config/config.dart << 'CONFIGEOF'
          class Config {
            static const String supabaseUrl = '\${{ secrets.SUPABASE_URL }}';
            static const String supabaseAnonKey = '\${{ secrets.SUPABASE_ANON_KEY }}';
            static const String supabaseGreenhouse = '\${{ secrets.SUPABASE_GREENHOUSE || ''east-suburb-farm'' }}';
            static const String emqxHost = '\${{ secrets.EMQX_HOST }}';
            static const int emqxPort = 1883;
            static const String emqxClientId = 'smart_farm_flutter_app';
            static const String topicReport = 'smart_farm/report';
            static const String topicCommand = 'smart_farm/command';
            static const String topicResponse = 'smart_farm/response';
            static const String topicStatus = 'smart_farm/status';
          }
          CONFIGEOF

      - name: Install dependencies
        run: flutter pub get

      - name: Generate native splash
        run: dart run flutter_native_splash:create

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart_farm-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
